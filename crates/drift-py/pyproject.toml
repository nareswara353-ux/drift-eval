[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "drift-py"
version = "0.1.0"
description = "Python bindings for drift-eval statistical drift detection engine"
readme = "README.MD"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Drift-Eval Team", email = "team@drift-eval.dev" }]
keywords = ["statistics", "drift", "kolmogorov-smirnov", "wasserstein", "rust"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://drift-eval.dev"
Repository = "https://github.com/drift-eval/drift-eval"

[tool.maturin]
module-name = "drift_py"
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
strip = true
