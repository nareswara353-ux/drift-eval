[workspace]
resolver = "2"
members = [
    "crates/drift-core",
    "crates/drift-math",
    "crates/drift-parallel",
    "crates/drift-report",
    "crates/drift-cli",
    "crates/drift-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Drift-Eval Team <team@drift-eval.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drift-eval/drift-eval"
homepage = "https://drift-eval.dev"
documentation = "https://docs.drift-eval.dev"
description = "High-Performance Statistical Validation & Distribution Drift Evaluator Engine"

[workspace.dependencies]
drift-core = { path = "crates/drift-core", version = "0.1.0" }
drift-math = { path = "crates/drift-math", version = "0.1.0" }
drift-parallel = { path = "crates/drift-parallel", version = "0.1.0" }
drift-report = { path = "crates/drift-report", version = "0.1.0" }
drift-cli = { path = "crates/drift-cli", version = "0.1.0" }
drift-py = { path = "crates/drift-py", version = "0.1.0" }

thiserror = "1.0.69"
toml = "0.8"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
serde_yaml = "0.9.34"
rayon = "1.10.0"
memmap2 = "0.9.5"
tera = "1.20.0"
indicatif = "0.17.9"
clap = { version = "4.5.23", features = ["derive", "env"] }
anyhow = "1.0.95"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
statrs = "0.18.0"
pyo3 = { version = "0.23.3", features = ["extension-module", "abi3-py39"] }
numpy = "0.23.0"
criterion = "0.5.1"
tempfile = "3.15.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.bench]
inherits = "release"
debug = true
strip = "none"

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 3
