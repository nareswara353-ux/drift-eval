[package]
name = "drift-eval"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = [
    "crates/drift-core",
    "crates/drift-math",
    "crates/drift-parallel",
    "crates/drift-report",
    "crates/drift-cli",
    "crates/drift-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Drift Evaluator Engineering Team"]
repository = "https://github.com/drift-eval/drift-eval"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
drift-core = { path = "crates/drift-core" }
drift-math = { path = "crates/drift-math" }
drift-parallel = { path = "crates/drift-parallel" }
drift-report = { path = "crates/drift-report" }
drift-cli = { path = "crates/drift-cli" }

thiserror = "1.0"
anyhow = "1.0"
rayon = "1.10"
memmap2 = "0.9"
statrs = "0.16"
ndarray = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
console = "0.15"
tera = "1.20"
handlebars = "6.0"
pyo3 = { version = "0.22", features = ["extension-module"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
debug = false
lto = "thin"

[[bin]]
name = "drift-eval"
path = "src/main.rs"
